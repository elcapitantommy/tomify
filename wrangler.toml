name = "tomify"
main = "worker/index.ts"
compatibility_date = "2026-10-11"
minify = true
# Nothing reads function names, and keeping them costs about 4 KB of the 160 KB Worker budget.
keep_names = false
workers_dev = true

[build]
command = "node scripts/build-worker-info.mjs"

[vars]
NAVIDROME_ORIGIN = "https://tomify.tomdixon.uk"
# The DJ reads links with Deepgram Aura-2 (Workers Paid since 2026-10-18), with MeloTTS as backup.
TOMIFY_DJ_VOICE_MODEL = "aura"
# Players at home stream straight from the box here (docs/DEPLOYMENT.md). Plain dashboard variables are replaced on deploy, so it lives here.
TOMIFY_LAN_ORIGIN = "https://lan.tomify.tomdixon.uk:8789"
# Tomifin Downloader's own address: a second Custom Domain on this Worker (docs/TOMIFIN.md). Only Tomifin is served there.
TOMIFIN_HOSTNAME = "tomifin.tomdixon.uk"
# TomTube backend, reached through the recovery Cloudflare Tunnel.
TOMTUBE_SERVICE_URL = "https://tomtube-service.tomdixon.uk"

# Once a day (UTC): refresh imported Spotify playlists and check for new releases.
# Every five minutes: announce finished Recovery downloads (only when someone has notifications on).
[triggers]
crons = ["30 4 * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "TOMIFY_DB"
database_name = "tomify-metadata"
database_id = "5147af2c-ce21-4e41-9ad7-09c3b36e7145"
# The only source of the schema: "pnpm run deploy" applies new files here before deploying the Worker.
migrations_dir = "drizzle"

# Workers AI: the DJ's voice (Deepgram Aura-2 text to speech).
[ai]
binding = "AI"

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Everything but hashed assets reaches the Worker first, so it can tell Tomify's address from Tomifin's.
run_worker_first = ["/*", "!/assets/*"]
